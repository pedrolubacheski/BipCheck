; BipCheck - firmware do leitor (ESP32 + RC522 + buzzer)
; Comandos: pio run | pio run -t upload | pio device monitor | pio test -e native | pio check

[platformio]
default_envs = esp32dev

[env]
; Avisos viram erro só no nosso código (src/ e lib/), não nas bibliotecas de terceiros
build_src_flags = -Wall -Wextra -Werror
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance,portability --inline-suppr
check_skip_packages = yes

; Placa real
[env:esp32dev]
platform = espressif32@7.1.3
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@1.4.12

; Testes no PC, sem ESP32 (só a lógica pura de lib/bipcheck_core)
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
