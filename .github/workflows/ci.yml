# CI do BipCheck: roda a pirâmide de testes inteira em todo PR e push na main.
# Actions fixadas pelo hash do commit (a tag pode ser trocada; o hash não). O Dependabot atualiza os hashes.
# Os notebooks da equipe rodam só estáticos e unitários; a integração (Supabase local, Docker) roda aqui.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # a action lista os commits do PR pela API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: App (estáticos + unitários + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  functions:
    name: Edge Functions (estáticos + unitários)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/register-boarding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: deno task check
      - run: deno task test

  firmware:
    name: Firmware (estáticos + unitários + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install --only-binary :all: platformio==6.2.0
      # Segredos fictícios só para compilar (os reais nunca entram no Git)
      - run: cp include/secrets.example.h include/secrets.h
      - run: pio test -e native
      - run: pio check -e esp32dev --fail-on-defect=medium
      - run: pio run -e esp32dev

  integration:
    name: Integração (Supabase local)
    needs: [app, functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sobe o Supabase local (aplica as migrações)
        run: supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,mailpit

      - name: Exporta URL e chaves do Supabase local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Lint do banco (plpgsql_check)
        run: supabase db lint --level warning --fail-on error

      - name: Testes do banco (pgTAP)
        run: supabase test db

      - name: Tipos do banco batem com o código do app
        run: |
          supabase gen types typescript --local > app/src/lib/database.types.ts
          cd app && npm ci --ignore-scripts && npm run typecheck

      - name: Sobe a Edge Function
        run: |
          supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/functions/v1/register-boarding" || true)
            [ "$code" = "405" ] && exit 0
            sleep 2
          done
          cat functions.log
          exit 1

      - name: Integração da Edge Function
        working-directory: supabase/functions/register-boarding
        run: deno task test:integration

      - name: Integração dos services do app
        working-directory: app
        run: npm run test:integration
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
